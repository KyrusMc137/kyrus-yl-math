let selected="all", problems=[], idx=0, answered=false, score=0, streak=0, correct=0;

function pool(){
  if(selected==="derivative") return derivativeProblems50;
  if(selected==="extremum") return extremumProblems50;
  if(selected==="basic") return basicProblems;
  return [...basicProblems,...derivativeProblems50,...extremumProblems50];
}
function name(){
  return selected==="derivative"?"Đạo hàm":selected==="extremum"?"Tìm cực trị / cực tiểu":selected==="basic"?"Toán cơ bản":"Tất cả";
}
function load(){
  problems=pool(); idx=Math.floor(Math.random()*problems.length); answered=false;
  document.getElementById("answer").value="";
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="feedback";
  document.getElementById("progress").textContent=`Đề: ${name()} • ${problems.length} câu`;
  document.getElementById("question").textContent=problems[idx].q;
  document.getElementById("lessonInfo").textContent=`Đang chọn: ${name()}`;
}
function normalize(s){return String(s).toLowerCase().replace(/\s+/g,"").replace(/−/g,"-").replace(/²/g,"^2").replace(/³/g,"^3").replace(/⁴/g,"^4").replace(/⁵/g,"^5");}
function derivativeEqual(a,b){return normalize(a).replace(/f\'(x)=/g,"").replace(/y\'= /g,"")===normalize(b)}

function keyInput(value){
  const input=document.getElementById("answer");
  const start=input.selectionStart ?? input.value.length;
  const end=input.selectionEnd ?? input.value.length;
  input.value=input.value.slice(0,start)+value+input.value.slice(end);
  input.focus();
  const pos=start+value.length;
  try{input.setSelectionRange(pos,pos)}catch(e){}
}
function keyBackspace(){
  const input=document.getElementById("answer");
  const start=input.selectionStart ?? input.value.length;
  const end=input.selectionEnd ?? input.value.length;
  if(start!==end){
    input.value=input.value.slice(0,start)+input.value.slice(end);
    try{input.setSelectionRange(start,start)}catch(e){}
  }else if(start>0){
    input.value=input.value.slice(0,start-1)+input.value.slice(start);
    try{input.setSelectionRange(start-1,start-1)}catch(e){}
  }
  input.focus();
}

function check(){
  if(answered)return;
  const p=problems[idx], input=document.getElementById("answer").value.trim();
  if(!input)return;
  const ok=p.type==="derivative"?derivativeEqual(input,p.a):normalize(input)===normalize(p.a);
  const f=document.getElementById("feedback"); answered=true;
  if(ok){const pts= p.type==="derivative"?20:p.type==="extremum"?30:10; const add=pts+streak*5;score+=add;streak++;correct++;f.textContent=`✅ Chính xác! +${add} điểm`;f.className="feedback good"}
  else{streak=0;f.textContent=`❌ Chưa đúng. Đáp án: ${p.a}`;f.className="feedback bad"}
  update();
}
function next(){load()}
function update(){document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak;document.getElementById("correct").textContent=correct}
function resetGame(){score=0;streak=0;correct=0;update();load()}
document.querySelectorAll(".lesson").forEach(b=>{b.addEventListener("click",()=>{
  selected=b.dataset.type;
  document.querySelectorAll(".lesson").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); score=0;streak=0;correct=0;update();load();
});});
document.getElementById("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
update();load();
</script>
</body></html>
